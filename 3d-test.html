<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Login Test</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden; /* Prevents screen scrolling while dragging on mobile */
        }

        .scene {
            width: 320px;
            height: 400px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.is-flipped {
            transform: perspective(1000px) rotateY(180deg) !important;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            background: #2a2a2a;
            color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        input {
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-text {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            cursor: pointer;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="card" id="loginCard">
            <!-- Front: Login Form -->
            <div class="card-face card-front">
                <h2>Welcome Back</h2>
                <input type="text" placeholder="Username" />
                <input type="password" placeholder="Password" />
                <button>Login</button>
                <p class="toggle-text" onclick="flipCard()">Need an account? Sign Up</p>
            </div>

            <!-- Back: Sign Up Form -->
            <div class="card-face card-back">
                <h2>Create Account</h2>
                <input type="text" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button>Register</button>
                <p class="toggle-text" onclick="flipCard()">Already have an account? Login</p>
            </div>
        </div>
    </div>

    <script>
        const scene = document.querySelector('.scene');
        const card = document.getElementById('loginCard');

        // 1. Flip toggle for both devices
        function flipCard() {
            card.classList.toggle('is-flipped');
            card.style.transform = '';
        }

        // 2. Universal 3D Tilt calculation (Mouse & Touch)
        function handleTilt(clientX, clientY) {
            if (card.classList.contains('is-flipped')) return;

            const rect = scene.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -18;
            const rotateY = ((x - centerX) / centerX) * 18;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        // Desktop: Mouse Move
        scene.addEventListener('mousemove', (e) => {
            card.style.transition = 'none';
            handleTilt(e.clientX, e.clientY);
        });

        scene.addEventListener('mouseleave', () => {
            if (!card.classList.contains('is-flipped')) {
                card.style.transition = 'transform 0.5s ease';
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            }
        });

        // Mobile: Touch Move / Drag
        scene.addEventListener('touchmove', (e) => {
            card.style.transition = 'none';
            const touch = e.touches[0];
            handleTilt(touch.clientX, touch.clientY);
        }, { passive: true });

        scene.addEventListener('touchend', () => {
            if (!card.classList.contains('is-flipped')) {
                card.style.transition = 'transform 0.5s ease';
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            }
        });
    </script>
</body>
</html>
